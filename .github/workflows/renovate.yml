name: Renovate
on:
  pull_request:
    branches:
    - renovate/**
  push:
    branches:
    - renovate/**

permissions: read-all

jobs:
  ghasum:
    name: Update gha.sum
    runs-on: ubuntu-24.04
    if: github.event_name == 'push' # && github.actor == 'renovate[bot]'
    steps:
    - name: Create automation token
      uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3.1.1
      id: automation-token
      with:
        client-id: ${{ secrets.AUTOMATION_APP_ID }}
        permission-contents: write # To push a commit
        permission-workflows: write # To push gha.sum
        private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
    - name: Checkout repository
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        persist-credentials: true
        token: ${{ steps.automation-token.outputs.token }}
    - name: Install Go
      uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
      with:
        go-version-file: go.mod
    - name: Update gha.sum
      run: go run github.com/chains-project/ghasum/cmd/ghasum update
    - name: Commit gha.sum
      uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7.2.0
      with:
        commit_message: Update ghasum checksums
        commit_options: --amend
        file_pattern: .github/workflows/gha.sum
        push_options: --force
